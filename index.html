<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Benjamin's Auto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --p1:#ff7b39; --p2:#2dd4bf; --p3:#4fa8ff; --p4:#7bd389;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    min-height:100vh;
    color:#38314f;
    text-align:center;
    background:linear-gradient(120deg,var(--p1),var(--p3),var(--p4),var(--p2));
    background-size:400% 400%;
    animation:flow 16s ease infinite;
    padding:24px 14px 50px;
    overflow-x:hidden;
  }
  @keyframes flow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

  h1{
    font-size:clamp(1.9rem,8vw,2.8rem);
    color:#fff;
    text-shadow:3px 3px 0 rgba(0,0,0,0.15);
    animation:pop 2.5s ease-in-out infinite;
  }
  @keyframes pop{0%,100%{transform:scale(1) rotate(-1deg);}50%{transform:scale(1.04) rotate(1deg);}}
  .sub{font-size:clamp(0.95rem,3.5vw,1.15rem); color:#fff; margin:4px 0 22px; text-shadow:1px 1px 0 rgba(0,0,0,0.12);}

  /* ---- car screen bezel ---- */
  .dashboard{
    max-width:min(980px, 92vw, calc(100vh - 230px));
    margin:0 auto; aspect-ratio:1/1;
    background:#111827; border-radius:26px; border:10px solid #2a2a35;
    box-shadow:0 10px 0 rgba(0,0,0,0.25), 0 0 0 3px rgba(255,255,255,0.15);
    position:relative; overflow:hidden;
  }
  @supports (height: 100dvh){
    .dashboard{ max-width:min(980px, 92vw, calc(100dvh - 230px)); }
  }
  .statusbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 12px; color:#e5e7eb; font-size:0.8rem; font-weight:bold;
  }
  .backbtn{background:none; border:none; color:#e5e7eb; font-size:1.3rem; cursor:pointer; visibility:hidden; padding:0 4px;}
  .statusicons{font-size:0.85rem;}

  .car-screen{display:none; position:relative; height:calc(100% - 30px);}
  .car-screen.active{display:block;}

  /* ---- home ---- */
  .app-grid{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; align-items:center; height:100%; padding:10px;}
  .car-app{display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; cursor:pointer;}
  .car-icon{
    width:58px; height:58px; border-radius:15px; display:flex; align-items:center; justify-content:center;
    font-size:1.7rem; box-shadow:0 4px 0 rgba(0,0,0,0.3); transition:transform .08s ease;
  }
  .car-app:active .car-icon{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.3);}
  .car-label{font-size:0.7rem; color:#e5e7eb; font-weight:bold;}
  .car-icon.music{background:#d6336c;}
  .car-icon.maps{background:#137333;}
  .car-icon.phone{background:#2563eb;}
  .car-icon.climate{background:#0891b2;}
  .car-icon.texting{background:#9333ea;}

  /* ---- maps ---- */
  .map-bg{position:absolute; inset:0; background:#dbe9d8; overflow:hidden;}
  .road-v{position:absolute; top:0; width:8%; height:100%; background:#4a4a55; z-index:0;}
  .road-v::after{content:""; position:absolute; left:50%; top:0; width:2px; height:100%; background:repeating-linear-gradient(#fff 0 10px, transparent 10px 20px); transform:translateX(-50%);}
  .road-h{position:absolute; left:0; height:8%; width:100%; background:#4a4a55; z-index:0;}
  .road-h::after{content:""; position:absolute; top:50%; left:0; height:2px; width:100%; background:repeating-linear-gradient(90deg,#fff 0 10px, transparent 10px 20px); transform:translateY(-50%);}
  .crosswalk{position:absolute; z-index:0;}
  .crosswalk.horiz{width:8%; height:16px; transform:translate(-50%,-50%); background:repeating-linear-gradient(90deg,#fff 0 4px, transparent 4px 10px);}
  .crosswalk.vert{width:16px; height:8%; transform:translate(-50%,-50%); background:repeating-linear-gradient(0deg,#fff 0 4px, transparent 4px 10px);}
  .street-sign{position:absolute; font-size:1.3rem; transform:translate(-50%,-50%); z-index:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,0.35));}
  .bridge{position:absolute; width:10%; height:40px; background:#8b6b3a; border:2px solid #6b4a23; border-radius:2px; transform:translate(-50%,-50%); z-index:5;}
  #mapPinsLayer{position:absolute; inset:0; z-index:2;}
  .car-dot{position:absolute; left:18%; top:80%; font-size:1.5rem; transition:left 0.75s linear, top 0.75s linear; z-index:3;}
  .map-pin{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; cursor:pointer; z-index:2; padding:0;}
  .map-pin .pin-emo{font-size:1.4rem; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.35));}
  .map-pin .pin-label{font-size:0.5rem; font-weight:bold; color:#1f2937; background:rgba(255,255,255,0.9); border-radius:6px; padding:1px 4px; white-space:nowrap; line-height:1.3;}
  .map-pin:active{transform:translate(-50%,-50%) scale(0.88);}
  .water-pond{position:absolute; width:56px; height:38px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #8ed4f0, #2f7fb8); box-shadow:inset 0 0 8px rgba(0,0,0,0.2); transform:translate(-50%,-50%); z-index:1;}
  .water-river{position:absolute; width:60%; height:30px; background:linear-gradient(90deg,#8ed4f0,#4fa8ff 40%,#2f7fb8 70%,#8ed4f0); border-radius:30px; transform:translate(-50%,-50%) rotate(-3deg); z-index:1; opacity:0.9; overflow:hidden;}
  .water-river::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(255,255,255,0.5) 0 8px, transparent 8px 18px);}
  .map-topbar{position:absolute; top:46px; right:8px; z-index:3;}
  .home-shortcut{background:#fff; border:none; border-radius:999px; padding:7px 12px; font-weight:bold; font-size:0.8rem; color:#1a73e8; cursor:pointer; font-family:inherit;}
  .home-shortcut:active{transform:translateY(1px);}
  .recent-notifs{position:absolute; top:86px; right:8px; z-index:3; display:flex; flex-direction:column; gap:6px; align-items:flex-end;}
  .recent-notif{
    background:rgba(17,24,39,0.85); border:none; border-radius:10px; padding:6px 10px;
    display:flex; align-items:center; gap:6px; cursor:pointer; font-family:inherit;
    box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .recent-notif:active{transform:translateY(1px);}
  .recent-notif-emo{font-size:1.1rem;}
  .recent-notif-label{font-size:0.68rem; font-weight:bold; color:#e5e7eb; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .season-picker{position:absolute; top:46px; left:8px; display:flex; gap:4px; z-index:4;}
  .season-btn{width:26px; height:26px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,0.25); font-size:0.85rem; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;}
  .season-btn.selected{background:#fff; box-shadow:0 0 0 2px #4fa8ff;}
  .season-btn:active{transform:translateY(1px);}
  .season-tree{position:absolute; font-size:1.4rem; z-index:1; pointer-events:none; transform:translate(-50%,-50%);}
  .search-bar-row{position:absolute; top:8px; left:8px; right:8px; z-index:6;}
  .search-input{
    width:100%; box-sizing:border-box; background:rgba(255,255,255,0.95); border:none; border-radius:999px;
    padding:8px 14px; font-size:0.8rem; font-family:inherit; color:#333;
  }
  .search-input:focus{outline:2px solid #4fa8ff;}
  .search-results{
    display:none; position:absolute; top:40px; left:8px; right:8px; z-index:6;
    background:rgba(17,24,39,0.97); border-radius:12px; max-height:55%; overflow-y:auto;
  }
  .search-results.open{display:block;}
  .search-result-item{
    display:flex; align-items:center; gap:8px; padding:8px 12px; color:#e5e7eb;
    font-size:0.8rem; font-weight:bold; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .search-result-item:last-child{border-bottom:none;}
  .search-result-item:active{background:rgba(255,255,255,0.12);}
  .search-result-emo{font-size:1.1rem;}
  .search-no-results{padding:10px 12px; color:#e5e7eb; opacity:0.7; font-size:0.78rem; text-align:center;}
  .nav-banner{
    position:absolute; bottom:8px; left:8px; right:8px; background:rgba(0,0,0,0.7); color:#fff;
    padding:8px; border-radius:10px; text-align:center; font-size:0.8rem; z-index:3; display:none;
  }
  .traffic-badge{
    position:absolute; bottom:44px; left:8px; z-index:3; padding:5px 10px; border-radius:8px;
    font-weight:bold; font-size:0.78rem; color:#fff; display:none; box-shadow:0 2px 0 rgba(0,0,0,0.25);
  }
  .traffic-badge.low{background:#22c55e;}
  .traffic-badge.medium{background:#f59e0b;}
  .traffic-badge.high{background:#ef4444;}

  /* ---- music player ---- */
  .player-card{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#e5e7eb; gap:8px; padding:10px;}
  .album-art{
    width:90px; height:90px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:2.2rem; box-shadow:0 6px 10px rgba(0,0,0,0.3);
    background:linear-gradient(135deg,#d6336c,#8a1c48);
  }
  .album-art.spinning{animation:spin 3s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .song-title{font-weight:bold; font-size:1rem;}
  .song-artist{font-size:0.8rem; opacity:0.8;}
  .progress-bar{width:75%; max-width:200px; height:6px; background:rgba(255,255,255,0.2); border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; width:35%; background:#e5e7eb; border-radius:3px;}
  .player-controls{display:flex; gap:16px; margin-top:4px;}
  .player-controls button{background:none; border:none; font-size:1.5rem; color:#e5e7eb; cursor:pointer;}
  .volume-row{display:flex; align-items:center; gap:8px; width:70%; max-width:200px;}
  .volume-row #volIcon{font-size:1.1rem;}
  .volume-row input[type="range"]{
    flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
    background:rgba(255,255,255,0.25); outline:none;
  }
  .volume-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:#d6336c; border:2px solid #fff; cursor:pointer;
  }
  .volume-row input[type="range"]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; background:#d6336c; border:2px solid #fff; cursor:pointer;
  }
  .playlist-row{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; justify-content:center; padding:0 8px;}
  .playlist-pick{background:rgba(255,255,255,0.12); border:none; border-radius:8px; padding:5px 8px; font-size:0.75rem; color:#e5e7eb; cursor:pointer; font-family:inherit;}
  .playlist-pick.selected{background:#d6336c;}
  .playlist-pick:active{transform:translateY(2px);}

  /* ---- phone ---- */
  .phone-idle,.phone-calling,.phone-active,.phone-incoming{
    display:none; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:#e5e7eb; padding:10px;
  }
  .phone-idle{display:flex;}
  .contact-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; width:100%; max-width:280px;}
  .contact-btn{
    background:rgba(255,255,255,0.12); border:none; border-radius:12px; padding:10px 6px; color:#e5e7eb;
    font-size:0.8rem; font-weight:bold; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .contact-btn:active{transform:translateY(2px);}
  .contact-emo{font-size:1.6rem;}
  .caller-avatar{font-size:2.4rem;}
  .caller-avatar.ringing{animation:ringPulse 0.9s ease-in-out infinite;}
  @keyframes ringPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .caller-name{font-weight:bold; font-size:1.05rem;}
  .calling-label{font-size:0.8rem; opacity:0.8;}
  .call-actions{display:flex; gap:24px;}
  .call-btn{width:50px; height:50px; border-radius:50%; border:none; font-size:1.3rem; cursor:pointer; color:#fff;}
  .call-btn.answer{background:#22c55e;}
  .call-btn.decline{background:#ef4444;}
  .call-btn.leave{background:#ef4444; width:auto; border-radius:999px; padding:0 18px; font-size:0.9rem; font-weight:bold; height:40px;}
  .call-timer{font-size:1.2rem; font-weight:bold;}
  .call-msg{font-size:0.85rem; background:rgba(255,255,255,0.12); border-radius:10px; padding:6px 12px; max-width:220px;}
  .call-options{display:flex; gap:10px;}
  .call-option-btn{background:rgba(255,255,255,0.18); border:2px solid #fff; border-radius:999px; padding:8px 14px; color:#fff; font-family:inherit; font-weight:bold; font-size:0.78rem; cursor:pointer;}
  .call-option-btn:active{transform:translateY(2px);}

  /* ---- texting ---- */
  .texting-list,.texting-chat{display:none; height:100%; padding:10px; box-sizing:border-box;}
  .texting-list{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;}
  .texting-chat{flex-direction:column;}
  .chat-header{display:flex; align-items:center; gap:8px; padding-bottom:8px; color:#e5e7eb; flex-shrink:0;}
  .chat-back-btn{background:none; border:none; color:#e5e7eb; font-size:0.85rem; font-weight:bold; cursor:pointer; font-family:inherit; padding:4px 2px;}
  .chat-back-btn:active{opacity:0.7;}
  .chat-header-emo{font-size:1.4rem;}
  .chat-header-name{font-weight:bold; font-size:1rem;}
  .chat-thread{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:6px 2px;}
  .chat-bubble{max-width:75%; padding:8px 12px; border-radius:14px; font-size:0.82rem; text-align:left; line-height:1.35; word-wrap:break-word;}
  .chat-bubble.them{align-self:flex-start; background:rgba(255,255,255,0.15); color:#e5e7eb; border-bottom-left-radius:4px;}
  .chat-bubble.me{align-self:flex-end; background:#9333ea; color:#fff; border-bottom-right-radius:4px;}
  .chat-bubble.typing{opacity:0.6; font-style:italic;}
  .chat-input-row{display:flex; gap:8px; padding-top:8px; flex-shrink:0;}
  .chat-input{
    flex:1; min-width:0; border:none; border-radius:999px; padding:9px 14px; font-size:0.85rem;
    font-family:inherit; background:rgba(255,255,255,0.95); color:#333; -webkit-user-select:text; user-select:text;
  }
  .chat-input:focus{outline:2px solid #9333ea;}
  .chat-send-btn{width:40px; height:40px; border-radius:50%; border:none; background:#9333ea; color:#fff; font-size:1.1rem; cursor:pointer; flex-shrink:0;}
  .chat-send-btn:active{transform:translateY(2px);}

  /* ---- climate ---- */
  .climate-card{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:#e5e7eb; padding:8px;}
  .temp-block{display:flex; align-items:center; gap:14px;}
  .climate-btn{
    width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,0.15);
    color:#e5e7eb; font-size:1.1rem; cursor:pointer;
  }
  .climate-btn:active{transform:translateY(2px);}
  .climate-btn.small{width:30px; height:30px; font-size:0.9rem;}
  .temp-display{font-size:1.8rem; font-weight:bold;}
  .fan-block{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .fan-icon{font-size:1.7rem; display:inline-block; animation:spin 2s linear infinite; animation-play-state:paused;}
  .fan-dots{display:flex; gap:4px;}
  .fan-dot{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.2);}
  .fan-dot.on{background:#4fa8ff;}
  .fan-buttons{display:flex; align-items:center; gap:8px; font-size:0.75rem;}
  .seat-block{display:flex; gap:10px;}
  .seat-btn{
    background:rgba(255,255,255,0.12); border:none; border-radius:10px; padding:8px 10px; color:#e5e7eb;
    font-size:0.72rem; font-weight:bold; cursor:pointer; font-family:inherit; line-height:1.3;
  }
  .seat-btn.lvl-1{background:rgba(239,68,68,0.3);}
  .seat-btn.lvl-2{background:rgba(239,68,68,0.55);}
  .seat-btn.lvl-3{background:rgba(239,68,68,0.85);}
  .seat-btn:active{transform:translateY(2px);}
  .defrost-btn{
    background:rgba(255,255,255,0.12); border:none; border-radius:999px; padding:8px 16px; color:#e5e7eb;
    font-size:0.8rem; font-weight:bold; cursor:pointer; font-family:inherit;
  }
  .defrost-btn.on{background:#0891b2;}
  .defrost-btn:active{transform:translateY(2px);}

  footer{margin-top:22px; font-size:0.8rem; color:#fff; opacity:0.85; text-shadow:1px 1px 0 rgba(0,0,0,0.1);}
</style>
</head>
<body>
  <h1>🏎️ Benjamin's Auto</h1>
  <p class="sub">Tap an app to explore your dashboard!</p>

  <div class="dashboard">
    <div class="statusbar">
      <button class="backbtn" id="backBtn">←</button>
      <div id="clock">10:32</div>
      <div class="statusicons">📶 🔋</div>
    </div>

    <!-- ==== HOME ==== -->
    <div class="car-screen active" id="screen-home">
      <div class="app-grid">
        <button class="car-app" data-screen="music">
          <div class="car-icon music">🎵</div>
          <div class="car-label">Music</div>
        </button>
        <button class="car-app" data-screen="maps">
          <div class="car-icon maps">🗺️</div>
          <div class="car-label">Maps</div>
        </button>
        <button class="car-app" data-screen="phone">
          <div class="car-icon phone">📞</div>
          <div class="car-label">Phone</div>
        </button>
        <button class="car-app" data-screen="texting">
          <div class="car-icon texting">💬</div>
          <div class="car-label">Texting</div>
        </button>
        <button class="car-app" data-screen="climate">
          <div class="car-icon climate">🌡️</div>
          <div class="car-label">Climate</div>
        </button>
      </div>
    </div>

    <!-- ==== MUSIC ==== -->
    <div class="car-screen" id="screen-music">
      <div class="player-card">
        <div class="album-art" id="albumArt">🎸</div>
        <div class="song-title" id="songTitle">Turbo Beat</div>
        <div class="song-artist" id="songArtist">The Motorheads</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="player-controls">
          <button id="musicPrev">⏮</button>
          <button id="musicPlay">▶️</button>
          <button id="musicNext">⏭</button>
        </div>
        <div class="volume-row">
          <span id="volIcon">🔊</span>
          <input type="range" id="volumeSlider" min="0" max="100" value="70">
        </div>
        <div class="playlist-row" id="playlistRow"></div>
      </div>
    </div>

    <!-- ==== MAPS ==== -->
    <div class="car-screen" id="screen-maps">
      <div class="map-bg">
        <div class="road-v" style="left:14%;"></div>
        <div class="road-v" style="left:46%;"></div>
        <div class="road-v" style="left:78%;"></div>
        <div class="road-h" style="top:16%;"></div>
        <div class="road-h" style="top:46%;"></div>
        <div class="road-h" style="top:76%;"></div>

        <div class="crosswalk horiz" style="left:18%; top:35%;"></div>
        <div class="street-sign" style="left:26%; top:35%;">🚸</div>
        <div class="crosswalk vert" style="left:34%; top:20%;"></div>
        <div class="street-sign" style="left:34%; top:28%;">🚸</div>
        <div class="crosswalk horiz" style="left:82%; top:65%;"></div>
        <div class="street-sign" style="left:74%; top:65%;">🚸</div>
        <div class="crosswalk vert" style="left:66%; top:80%;"></div>
        <div class="street-sign" style="left:66%; top:72%;">🚸</div>

        <div class="street-sign" style="left:18%; top:20%;">🛑</div>
        <div class="street-sign" style="left:50%; top:20%;">🛑</div>
        <div class="street-sign" style="left:82%; top:20%;">🛑</div>
        <div class="street-sign" style="left:18%; top:50%;">🛑</div>
        <div class="street-sign" style="left:50%; top:50%;">🛑</div>
        <div class="street-sign" style="left:82%; top:50%;">🛑</div>
        <div class="street-sign" style="left:18%; top:80%;">🛑</div>
        <div class="street-sign" style="left:50%; top:80%;">🛑</div>
        <div class="street-sign" style="left:82%; top:80%;">🛑</div>

        <div class="bridge" style="left:18%; top:72%;"></div>

let audioCtx;
function ctx(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq, start, dur, type, gainMax){
  const c = ctx();
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, c.currentTime + start);
  gain.gain.setValueAtTime(0, c.currentTime + start);
  gain.gain.linearRampToValueAtTime(gainMax || 0.15, c.currentTime + start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(c.currentTime + start);
  osc.stop(c.currentTime + start + dur + 0.05);
}

// street centerlines the car is allowed to drive along
const STREET_X = [18, 50, 82];
const STREET_Y = [20, 50, 80];
const DRIVE_LEG_MS = 750;
const TRAFFIC_LEVELS = [
  { cls:"low",    label:"light traffic" },
  { cls:"medium", label:"moderate traffic" },
  { cls:"high",   label:"heavy traffic" },
];

function nearestOf(value, options){
  return options.reduce((a, b) => Math.abs(b - value) < Math.abs(a - value) ? b : a);
}

// Every road band spans the full width (horizontal streets) or full height
// (vertical streets), so a point stays on-road for an entire move as long as
// ONE coordinate is held fixed at a STREET_X/STREET_Y value. curbPointFor()
// projects a destination onto whichever nearby street is closer, so the car
// never has to leave the road grid to "arrive" somewhere.
function curbPointFor(place){
  const px = parseFloat(place.left), py = parseFloat(place.top);
  const vx = nearestOf(px, STREET_X);
  const hy = nearestOf(py, STREET_Y);
  if (Math.abs(px - vx) <= Math.abs(py - hy)){
    return { x: vx, y: py, axis: "x" }; // parks along a vertical street
  }
  return { x: px, y: hy, axis: "y" }; // parks along a horizontal street
}

function buildRoute(start, dest){
  if (start.axis === "y" && dest.axis === "y"){
    if (start.y === dest.y) return [{ x: dest.x, y: start.y }];
    const vx = nearestOf(dest.x, STREET_X);
    return [{ x: vx, y: start.y }, { x: vx, y: dest.y }, { x: dest.x, y: dest.y }];
  }
  if (start.axis === "x" && dest.axis === "x"){
    if (start.x === dest.x) return [{ x: start.x, y: dest.y }];
    const hy = nearestOf(dest.y, STREET_Y);
    return [{ x: start.x, y: hy }, { x: dest.x, y: hy }, { x: dest.x, y: dest.y }];
  }
  if (start.axis === "y" && dest.axis === "x"){
    return [{ x: dest.x, y: start.y }, { x: dest.x, y: dest.y }];
  }
  return [{ x: start.x, y: dest.y }, { x: dest.x, y: dest.y }]; // start.axis === "x", dest.axis === "y"
}

let carPos = { x: 18, y: 80, axis: "x" };
let visitHistory = [];
let isNavigating = false;

function recordVisit(place){
  if (visitHistory.length && visitHistory[visitHistory.length - 1].id === place.id) return;
  visitHistory.push(place);
  if (visitHistory.length > 2) visitHistory.shift();
}

function renderRecentNotifications(){
  const box = document.getElementById("recentNotifs");
  box.innerHTML = "";
  if (isNavigating || visitHistory.length === 0) return;
  visitHistory.forEach(place => {
    const card = document.createElement("button");
    card.className = "recent-notif";
    card.innerHTML = `<span class="recent-notif-emo">${place.emo}</span><span class="recent-notif-label">${place.name}</span>`;
    card.addEventListener("click", () => goToDestination(place));
    box.appendChild(card);
  });
}

function goToDestination(place){
  tone(880, 0, 0.1, "sine", 0.15);
  tone(660, 0.08, 0.15, "sine", 0.12);
  driveToken++;
  const myToken = driveToken;
  isNavigating = true;
  renderRecentNotifications();

  const dot = document.getElementById("mapCarDot");
  const banner = document.getElementById("navBanner");
  const badge = document.getElementById("trafficBadge");

  const dest = curbPointFor(place);
  const route = buildRoute(carPos, dest);
  carPos = dest;

  const traffic = TRAFFIC_LEVELS[Math.floor(Math.random() * TRAFFIC_LEVELS.length)];
  const arrival = new Date(Date.now() + place.minutes * 60000);
  const arrivalStr = arrival.toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  badge.textContent = place.minutes + " min · arrive " + arrivalStr;
  badge.className = "traffic-badge " + traffic.cls;
  badge.style.display = "block";

  banner.textContent = `Navigating to ${place.name}... (${traffic.label})`;
  banner.style.display = "block";

  let i = 0;
  function nextLeg(){
    if (myToken !== driveToken) return;
    if (i >= route.length){
      let msg = `You're at ${place.name}! 🎉`;
      if (place.greet){
        const line = place.greet.lines[Math.floor(Math.random() * place.greet.lines.length)];
        msg += ` ${place.greet.who}: ${line}`;
      }
      banner.textContent = msg;
      badge.style.display = "none";
      isNavigating = false;
      recordVisit(place);
      renderRecentNotifications();
      return;
    }
    const wp = route[i++];
    dot.style.left = wp.x + "%";
    dot.style.top = wp.y + "%";
    setTimeout(nextLeg, DRIVE_LEG_MS);
  }
  nextLeg();
}

      water.style.left = place.left;
      water.style.top = place.top;

    const pin = document.createElement("button");
    pin.className = "map-pin";
    pin.style.left = place.left;

    pin.innerHTML = `<span class="pin-emo">${place.emo}</span><span class="pin-label">${place.name}</span>`;
    pin.addEventListener("click", () => goToDestination(place));
    layer.appendChild(pin);
  });
}

function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
}
function renderContacts(){
  const grid = document.getElementById("contactGrid");
  grid.innerHTML = "";
  CONTACTS.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "contact-btn";
    btn.innerHTML = `<span class="contact-emo">${c.emo}</span><span>${c.name}</span>`;
    btn.addEventListener("click", () => startCall(c));
    grid.appendChild(btn);
  });
}
function startCall(contact){
  cancelIncomingCall();
  document.getElementById("phoneIdle").style.display = "none";
  document.getElementById("phoneCalling").style.display = "flex";
  document.getElementById("callingAvatar").textContent = contact.emo;
  document.getElementById("callingName").textContent = contact.name;
  const ring = setInterval(() => {
    tone(600, 0, 0.15, "sine", 0.15);
    tone(500, 0.15, 0.15, "sine", 0.12);
  }, 900);
  callingTimeout = setTimeout(() => {
    clearInterval(ring);
    connectCall(contact);
  }, 1800);
  document.getElementById("cancelCallBtn").onclick = () => {
    clearInterval(ring);
    clearTimeout(callingTimeout);
    document.getElementById("phoneCalling").style.display = "none";
    document.getElementById("phoneIdle").style.display = "flex";
    scheduleIncomingCall();
  };
}

function scheduleIncomingCall(){
  clearTimeout(incomingCallTimeout);
  incomingCallTimeout = setTimeout(triggerIncomingCall, 45000 + Math.random() * 60000);
}
function triggerIncomingCall(){
  if (document.getElementById("phoneIdle").style.display !== "flex"){
    scheduleIncomingCall();
    return;
  }
  const contact = CONTACTS[Math.floor(Math.random() * CONTACTS.length)];
  document.getElementById("phoneIdle").style.display = "none";
  document.getElementById("phoneIncoming").style.display = "flex";
  document.getElementById("incomingAvatar").textContent = contact.emo;
  document.getElementById("incomingName").textContent = contact.name;
  incomingRingInterval = setInterval(() => {
    tone(600, 0, 0.15, "sine", 0.15);
    tone(500, 0.15, 0.15, "sine", 0.12);
  }, 900);
  document.getElementById("answerIncomingBtn").onclick = () => {
    clearInterval(incomingRingInterval); incomingRingInterval = null;
    document.getElementById("phoneIncoming").style.display = "none";
    connectCall(contact);
  };
  document.getElementById("declineIncomingBtn").onclick = () => {
    clearInterval(incomingRingInterval); incomingRingInterval = null;
    document.getElementById("phoneIncoming").style.display = "none";
    document.getElementById("phoneIdle").style.display = "flex";
    scheduleIncomingCall();
  };
}
function connectCall(contact){
  tone(880, 0, 0.15, "sine", 0.15);
  document.getElementById("phoneCalling").style.display = "none";
  document.getElementById("phoneActive").style.display = "flex";
  document.getElementById("activeAvatar").textContent = contact.emo;
  document.getElementById("activeName").textContent = contact.name;

  const msgEl = document.getElementById("callMsg");
  const optsEl = document.getElementById("callOptions");
  const hangupBtn = document.getElementById("hangupBtn");
  optsEl.innerHTML = "";
  hangupBtn.style.display = "";

  const script = contact.bySeason[currentSeason];
  msgEl.textContent = contact.name + ": " + script.question;
  script.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "call-option-btn";
    btn.textContent = opt.label;
    btn.addEventListener("click", () => {
      tone(500, 0, 0.1, "triangle", 0.12);
      optsEl.innerHTML = "";
      hangupBtn.style.display = "none";
      msgEl.textContent = "You: " + opt.reply;
      scriptTimeout1 = setTimeout(() => {
        tone(700, 0, 0.15, "sine", 0.12);
        msgEl.textContent = contact.name + ": " + opt.response;
      }, 1100);
      scriptTimeout2 = setTimeout(() => {
        msgEl.textContent = contact.name + ": " + contact.bye;
      }, 2400);
      scriptTimeout3 = setTimeout(endCall, 3800);
    });
    optsEl.appendChild(btn);
  });

  callSeconds = 0;
  callTimerInterval = setInterval(() => {
    callSeconds++;
    document.getElementById("callTimer").textContent = formatTime(callSeconds);
  }, 1000);
}
function endCall(){
  clearInterval(callTimerInterval); callTimerInterval = null;
  clearTimeout(scriptTimeout1); scriptTimeout1 = null;
  clearTimeout(scriptTimeout2); scriptTimeout2 = null;
  document.getElementById("phoneActive").style.display = "none";
  document.getElementById("phoneIdle").style.display = "flex";
  document.getElementById("callTimer").textContent = "00:00";
  document.getElementById("callOptions").innerHTML = "";
  scheduleIncomingCall();
}

// Categories below assume the kid is saying something positive about that
// topic ("I'm hungry", "let's play"). If the message also has a negation
// word in it ("I'm NOT hungry", "I don't want to play"), matching the topic
// keyword alone gives a cheerful reply to the opposite of what was said —
// the "starts talking about something totally different" bug. Negated
// messages in these categories fall through to the neutral fallback bank
// instead, which never assumes a mood either way.
const NEGATION_GUARDED = new Set(["love","sad","excited","food","school","play","animal","weather","joke"]);
const NEGATION_RE = /\b(not|isn['’]?t|wasn['’]?t|aren['’]?t|don['’]?t|dont|didn['’]?t|can['’]?t|cant|won['’]?t|wont|never)\b/;

function classifyMessage(text){
  const lower = text.toLowerCase();
  for (const { cat, re } of CATEGORY_PATTERNS){
    if (re.test(lower)){
      if (NEGATION_GUARDED.has(cat) && NEGATION_RE.test(lower)) return "fallback";
      return cat;
    }
  }
  return "fallback";
}

function pickReply(contact, text){
  const cat = classifyMessage(text);
  if (cat !== "bye" && Math.random() < 0.3){
    const templates = ECHO_TEMPLATES[contact.name];
    const template = templates[Math.floor(Math.random() * templates.length)];
    return template.replace("{text}", text.length > 40 ? text.slice(0, 40) + "…" : text);
  }
  const pool = (CHAT_REPLIES[cat] && CHAT_REPLIES[cat][contact.name]) || CHAT_REPLIES.fallback[contact.name];
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderTextContacts(){
  const grid = document.getElementById("textContactGrid");
  grid.innerHTML = "";
  TEXT_CONTACTS.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "contact-btn";
    btn.innerHTML = `<span class="contact-emo">${c.emo}</span><span>${c.name}</span>`;
    btn.addEventListener("click", () => openChat(c));
    grid.appendChild(btn);
  });
}

function addChatBubble(who, text){
  const thread = document.getElementById("chatThread");
  const bubble = document.createElement("div");
  bubble.className = "chat-bubble " + who;
  bubble.textContent = text;
  thread.appendChild(bubble);
  thread.scrollTop = thread.scrollHeight;
  return bubble;
}

function openChat(contact){
  currentTextContact = contact;
  chatToken++;
  const myToken = chatToken;
  document.getElementById("textingList").style.display = "none";
  document.getElementById("textingChat").style.display = "flex";
  document.getElementById("chatHeaderEmo").textContent = contact.emo;
  document.getElementById("chatHeaderName").textContent = contact.name;
  document.getElementById("chatThread").innerHTML = "";
  document.getElementById("chatInput").value = "";

  const opener = contact.openers[Math.floor(Math.random() * contact.openers.length)];
  clearTimeout(chatTypingTimeout);
  chatTypingTimeout = setTimeout(() => {
    if (myToken !== chatToken) return;
    tone(700, 0, 0.12, "sine", 0.12);
    addChatBubble("them", opener);
  }, 500);
  document.getElementById("chatInput").focus();
}

document.getElementById("chatBackBtn").addEventListener("click", () => {
  chatToken++;
  clearTimeout(chatTypingTimeout); chatTypingTimeout = null;
  document.getElementById("textingChat").style.display = "none";
  document.getElementById("textingList").style.display = "flex";
});

function sendChatMessage(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text || !currentTextContact) return;
  tone(500, 0, 0.08, "triangle", 0.12);
  addChatBubble("me", text);
  input.value = "";

  const contact = currentTextContact;
  chatToken++;
  const myToken = chatToken;
  const typingBubble = addChatBubble("them typing", "...");

  clearTimeout(chatTypingTimeout);
  chatTypingTimeout = setTimeout(() => {
    typingBubble.remove();
    if (myToken !== chatToken) return;
    tone(700, 0, 0.12, "sine", 0.12);
    addChatBubble("them", pickReply(contact, text));
  }, 700 + Math.random() * 900);
}
document.getElementById("chatSendBtn").addEventListener("click", sendChatMessage);
document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendChatMessage();
});
renderTextContacts();

// ---------- climate ----------
let temp = 72, fan = 2, seatDriverLvl = 0, seatPaxLvl = 0, defrostOn = false;
const SEAT_LABELS = ["Off", "Low", "Med", "High"];

function renderClimate(){
  document.getElementById("tempValue").textContent = temp;

  const dots = document.getElementById("fanDots");
  dots.innerHTML = "";
  for (let i = 1; i <= 5; i++){
    const d = document.createElement("div");
    d.className = "fan-dot" + (i <= fan ? " on" : "");
    dots.appendChild(d);
  }
  const fanIcon = document.getElementById("fanIcon");
  if (fan > 0){
    fanIcon.style.animationPlayState = "running";
    fanIcon.style.animationDuration = (1.6 - fan * 0.22) + "s";
  } else {
    fanIcon.style.animationPlayState = "paused";
  }

  const driverBtn = document.getElementById("seatDriver");
  driverBtn.innerHTML = "🚗💺<br>Driver: " + SEAT_LABELS[seatDriverLvl];
  driverBtn.className = "seat-btn" + (seatDriverLvl > 0 ? " lvl-" + seatDriverLvl : "");

  const paxBtn = document.getElementById("seatPax");
  paxBtn.innerHTML = "🧑💺<br>Passenger: " + SEAT_LABELS[seatPaxLvl];
  paxBtn.className = "seat-btn" + (seatPaxLvl > 0 ? " lvl-" + seatPaxLvl : "");

  document.getElementById("defrostBtn").classList.toggle("on", defrostOn);
}

document.getElementById("tempDown").addEventListener("click", () => {
  temp = Math.max(60, temp - 1);
  tone(300, 0, 0.08, "triangle", 0.1);
  renderClimate();
});
document.getElementById("tempUp").addEventListener("click", () => {
  temp = Math.min(85, temp + 1);
  tone(500, 0, 0.08, "triangle", 0.1);
  renderClimate();
});
document.getElementById("fanDown").addEventListener("click", () => {
  fan = Math.max(0, fan - 1);
  tone(260, 0, 0.08, "triangle", 0.1);
  renderClimate();
});
document.getElementById("fanUp").addEventListener("click", () => {
  fan = Math.min(5, fan + 1);
  tone(460, 0, 0.08, "triangle", 0.1);
  renderClimate();
});
document.getElementById("seatDriver").addEventListener("click", () => {
  seatDriverLvl = (seatDriverLvl + 1) % 4;
  tone(400, 0, 0.1, "sine", 0.1);
  renderClimate();
});
document.getElementById("seatPax").addEventListener("click", () => {
  seatPaxLvl = (seatPaxLvl + 1) % 4;
  tone(400, 0, 0.1, "sine", 0.1);
  renderClimate();
});
document.getElementById("defrostBtn").addEventListener("click", () => {
  defrostOn = !defrostOn;
  tone(defrostOn ? 700 : 350, 0, 0.12, "sine", 0.12);
  renderClimate();
});
renderClimate();
</script>
